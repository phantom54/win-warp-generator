[package]
name = "warp_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chrono = "0.4"

[profile.release]
debug = false
strip = true
split-debuginfo = "off"